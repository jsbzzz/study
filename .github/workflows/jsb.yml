name: run python

on:
  push:
    branches:
      - main

jobs:
  run-main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python setting
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: run python
        run: python test/main.py